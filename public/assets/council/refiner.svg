                <circle cx="256" cy="256" r="50" fill="none" stroke="url(#gradient-refiner)" stroke-width="8" opacity="0.9"/>
                <circle cx="256" cy="256" r="25" fill="url(#gradient-refiner)" opacity="0.8"/>
