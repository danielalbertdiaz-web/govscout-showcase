<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-contrarian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <style>
      .bg-circle { fill: #DC262615; stroke: #DC262630; stroke-width: 2; }
      .symbol { filter: url(#drop-shadow); }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" class="bg-circle"/>

  <!-- Agent Symbol -->
  
            <g class="symbol">
                <path d="M180,256 L320,256" stroke="url(#gradient-contrarian)" stroke-width="12" stroke-linecap="round"/>
                <path d="M300,230 L320,256 L300,282" stroke="#DC2626" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M332,256 L192,256" stroke="#991B1B" stroke-width="8" stroke-linecap="round"/>
                <path d="M212,230 L192,256 L212,282" stroke="#991B1B" stroke-width="8" fill="none" stroke-linecap="round"/>
                <circle cx="256" cy="256" r="20" fill="#DC2626" stroke="white" stroke-width="4"/>
            </g>
</svg>