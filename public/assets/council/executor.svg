<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-executor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <style>
      .bg-circle { fill: #F59E0B15; stroke: #F59E0B30; stroke-width: 2; }
      .symbol { filter: url(#drop-shadow); }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" class="bg-circle"/>

  <!-- Agent Symbol -->
  
            <g class="symbol">
                <circle cx="296" cy="256" r="60" fill="none" stroke="url(#gradient-executor)" stroke-width="10"/>
                <circle cx="296" cy="256" r="35" fill="none" stroke="#F59E0B" stroke-width="6"/>
                <circle cx="296" cy="256" r="15" fill="#F59E0B"/>
                <path d="M176,256 L256,256" stroke="#D97706" stroke-width="12" stroke-linecap="round"/>
                <path d="M236,230 L256,256 L236,282" stroke="#D97706" stroke-width="8" fill="none" stroke-linecap="round"/>
            </g>
</svg>