<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-budget-reviewer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <style>
      .bg-circle { fill: #05966915; stroke: #05966930; stroke-width: 2; }
      .symbol { filter: url(#drop-shadow); }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" class="bg-circle"/>

