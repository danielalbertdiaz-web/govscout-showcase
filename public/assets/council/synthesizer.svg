<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-synthesizer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAB308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CA8A04;stop-opacity:1" />
    </linearGradient>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <style>
      .bg-circle { fill: #EAB30815; stroke: #EAB30830; stroke-width: 2; }
      .symbol { filter: url(#drop-shadow); }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" class="bg-circle"/>

  <!-- Agent Symbol -->
  
            <g class="symbol">
                <circle cx="256" cy="256" r="25" fill="url(#gradient-synthesizer)" stroke="white" stroke-width="4"/>
                <line x1="176" y1="176" x2="226" y2="226" stroke="#EAB308" stroke-width="8" stroke-linecap="round"/>
                <line x1="256" y1="176" x2="256" y2="226" stroke="#EAB308" stroke-width="8" stroke-linecap="round"/>
                <line x1="336" y1="176" x2="286" y2="226" stroke="#EAB308" stroke-width="8" stroke-linecap="round"/>
                <line x1="176" y1="336" x2="226" y2="286" stroke="#CA8A04" stroke-width="6" stroke-linecap="round"/>
                <line x1="256" y1="336" x2="256" y2="286" stroke="#CA8A04" stroke-width="6" stroke-linecap="round"/>
                <line x1="336" y1="336" x2="286" y2="286" stroke="#CA8A04" stroke-width="6" stroke-linecap="round"/>
            </g>
</svg>